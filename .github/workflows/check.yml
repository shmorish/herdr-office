name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 型チェック
        run: npx -y -p typescript@7.0.2 tsc -p .
      - name: 変換できるか
        run: npx -y -p esbuild@0.27.2 sh -c './build.sh dist/office' && ls dist/office/*.js
